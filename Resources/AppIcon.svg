<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" fill="none">
  <defs>
    <!-- macOS App Icon Squircle Shadow -->
    <filter id="iconShadow" x="-10%" y="-8%" width="120%" height="124%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#020617" flood-opacity="0.34"/>
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#020617" flood-opacity="0.22"/>
    </filter>

    <!-- Soft luminous glow behind center waveform -->
    <filter id="waveGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle drop glow for the falling word-drop -->
    <filter id="dropGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Deep obsidian-indigo glass background -->
    <linearGradient id="bgGrad" x1="180" y1="100" x2="844" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A2644"/>
      <stop offset="48%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D1A"/>
    </linearGradient>

    <!-- Ambient Apple-Silicon cyan/indigo radial sheen -->
    <radialGradient id="topAura" cx="512" cy="230" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.24"/>
      <stop offset="55%" stop-color="#6366F1" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>

    <!-- Bottom landing pool glow ("言落") -->
    <radialGradient id="bottomPool" cx="512" cy="760" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="65%" stop-color="#38BDF8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#090D1A" stop-opacity="0"/>
    </radialGradient>

    <!-- Rim specular highlight -->
    <linearGradient id="rimStroke" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.34"/>
      <stop offset="35%" stop-color="#94A3B8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.18"/>
    </linearGradient>

    <!-- Center voice bar gradient (bright pure white to luminous cyan) -->
    <linearGradient id="centerBarGrad" x1="512" y1="252" x2="512" y2="612" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="68%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>

    <!-- Inner side voice bars gradient -->
    <linearGradient id="midBarGrad" x1="0" y1="308" x2="0" y2="564" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#93C5FD" stop-opacity="0.88"/>
    </linearGradient>

    <!-- Outer voice bars gradient -->
    <linearGradient id="outerBarGrad" x1="0" y1="370" x2="0" y2="504" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.68"/>
    </linearGradient>

    <!-- Falling droplet gradient ("言落" signature accent) -->
    <linearGradient id="dropGrad" x1="512" y1="628" x2="512" y2="718" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="55%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Text landing baseline gradient ("字落成行") -->
    <linearGradient id="lineGrad" x1="308" y1="760" x2="716" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.0"/>
      <stop offset="20%" stop-color="#7DD3FC" stop-opacity="0.72"/>
      <stop offset="50%" stop-color="#E0F2FE" stop-opacity="0.96"/>
      <stop offset="80%" stop-color="#7DD3FC" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.0"/>
    </linearGradient>

    <clipPath id="squircleClip">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185"/>
    </clipPath>
  </defs>

  <!-- Main macOS Squircle Base -->
  <g filter="url(#iconShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bgGrad)"/>
  </g>

  <!-- Clipped internal lighting & subtle acoustic rings -->
  <g clip-path="url(#squircleClip)">
    <rect x="100" y="100" width="824" height="824" fill="url(#topAura)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#bottomPool)"/>

    <!-- Ultra-subtle concentric acoustic halo -->
    <circle cx="512" cy="436" r="244" stroke="#7DD3FC" stroke-opacity="0.07" stroke-width="2"/>
    <circle cx="512" cy="436" r="340" stroke="#818CF8" stroke-opacity="0.05" stroke-width="2"/>

    <!-- Top glass sheen -->
    <ellipse cx="512" cy="110" rx="340" ry="70" fill="#FFFFFF" fill-opacity="0.06"/>
  </g>

  <!-- Crisp inner rim highlight -->
  <rect x="102" y="102" width="820" height="820" rx="183" ry="183" stroke="url(#rimStroke)" stroke-width="3.5"/>

  <!-- Soft halo behind the 5-bar waveform -->
  <ellipse cx="512" cy="442" rx="190" ry="130" fill="#38BDF8" fill-opacity="0.14" filter="url(#waveGlow)"/>

  <!-- 5-Bar Acoustic Waveform (Voice / Dictation Core) -->
  <!-- Bar 1 (Far Left) -->
  <rect x="284" y="370" width="56" height="134" rx="28" fill="url(#outerBarGrad)"/>
  <!-- Bar 2 (Inner Left) -->
  <rect x="384" y="308" width="56" height="256" rx="28" fill="url(#midBarGrad)"/>
  <!-- Bar 3 (Center Core — tallest, bridges toward falling drop) -->
  <rect x="484" y="252" width="56" height="332" rx="28" fill="url(#centerBarGrad)"/>
  <!-- Bar 4 (Inner Right) -->
  <rect x="584" y="308" width="56" height="256" rx="28" fill="url(#midBarGrad)"/>
  <!-- Bar 5 (Far Right) -->
  <rect x="684" y="370" width="56" height="134" rx="28" fill="url(#outerBarGrad)"/>

  <!-- "言落" Signature Element: Luminous Falling Droplet (Sound crystallizing into a word) -->
  <g filter="url(#dropGlow)">
    <path d="M512 618 C512 618 552 666 552 693 C552 715.091 534.091 733 512 733 C489.909 733 472 715.091 472 693 C472 666 512 618 512 618 Z"
          fill="url(#dropGrad)"/>
    <!-- Crisp specular glint on droplet -->
    <ellipse cx="499" cy="686" rx="7.5" ry="13" transform="rotate(-18 499 686)" fill="#FFFFFF" fill-opacity="0.58"/>
  </g>

  <!-- Crisp Text Landing Line ("声落成文" — text cursor baseline) -->
  <rect x="308" y="766" width="408" height="18" rx="9" fill="url(#lineGrad)"/>
  <!-- Center impact ripple pill -->
  <rect x="454" y="766" width="116" height="18" rx="9" fill="#E0F2FE" fill-opacity="0.92"/>
</svg>
